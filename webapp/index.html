<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Послуги, запис і контакти</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  /* Палітра Наталії */
  :root {
    --milk: #F8F6F1;      /* основний фон */
    --white: #FFFEFC;     /* картки */
    --sand: #EDE3D8;      /* плашки та підкладки */
    --champ: #D6B875;     /* кнопки та золоті акценти */
    --champ2: #C4A35E;    /* темніший відтінок шампані для градієнта */
    --taupe: #8A786E;     /* другорядний текст */
    --choc: #3D302C;      /* заголовки та основний текст */
    --line: #EAE1D5;
    --serif: "Lora", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--milk); color: var(--choc);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 18px 44px; position: relative; overflow: hidden; }
  .decor { position: absolute; pointer-events: none; z-index: 0; }
  .decor.l { left: 0; top: 0; width: 150px; }
  .decor.r { right: 0; top: 34px; width: 92px; opacity: .9; }
  .hero { text-align: center; position: relative; z-index: 1; }
  .avatar { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; object-position: 50% 18%;
            border: 2px solid var(--champ); padding: 3px; background: var(--white);
            box-shadow: 0 10px 28px rgba(61,48,44,.10); }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 34px; margin: 14px 0 2px; letter-spacing: .2px; }
  .orn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 2px 0 8px; }
  .orn i { height: 1px; width: 70px; background: linear-gradient(90deg, transparent, var(--champ)); }
  .orn i:last-child { background: linear-gradient(90deg, var(--champ), transparent); }
  .role { color: var(--taupe); font-size: 14.5px; margin: 0 6px; }
  .intro { font-family: var(--serif); font-style: italic; font-size: 19px; margin: 12px 4px 0; white-space: pre-line; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }

  .chip { display: flex; align-items: center; gap: 9px; background: var(--sand); border-radius: 999px;
          padding: 7px 16px 7px 12px; font-size: 14px; color: var(--choc); text-align: left; line-height: 1.15; }
  .chip svg { width: 28px; height: 28px; flex: none; }
  .chip b { font-family: var(--serif); font-size: 18px; font-weight: 600; margin-right: 4px; }
  .chip .two b { display: block; margin: 0; }
  .chip .pre { display: block; }
  /* «Мій метод», «Чому мені довіряють», «Відгуки» */
  .sub { margin: -8px 2px 12px; color: #9C7A3C; font-family: var(--serif); font-style: italic; font-size: 16px; }
  .steps { background: var(--white); border: 1px solid var(--line); border-radius: 22px; padding: 6px 16px; }
  .step { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: 0; }
  .num { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
         font-family: var(--serif); font-weight: 600; font-size: 17px; background: linear-gradient(135deg, var(--champ), var(--champ2)); }
  .step b, .tr b { display: block; font-family: var(--serif); font-size: 17px; font-weight: 600; margin-bottom: 3px; }
  .step p, .tr p { margin: 0; white-space: pre-line; font-size: 15px; }
  .tr { display: flex; gap: 12px; background: var(--white); border: 1px solid var(--line); border-radius: 18px;
        padding: 14px 16px; margin-bottom: 10px; }
  .tr .ico { margin-top: 2px; }
  .quote { text-align: center; font-family: var(--serif); font-style: italic; color: var(--taupe); font-size: 16px;
           margin: 14px 10px 0; }
  .reviews { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 10px;
             margin: 0 -18px; padding-left: 18px; padding-right: 18px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .reviews::-webkit-scrollbar { display: none; }
  .rv-card { flex: 0 0 80%; scroll-snap-align: center; background: var(--white); border: 1px solid var(--line);
             border-radius: 20px; padding: 16px 18px; position: relative; }
  .rv-card .qm { font-family: var(--serif); font-size: 44px; line-height: .6; color: var(--champ); display: block; height: 18px; }
  .rv-card p { margin: 8px 0 10px; white-space: pre-line; font-family: var(--serif); font-style: italic; font-size: 16.5px; }
  .rv-card span { color: var(--taupe); font-size: 13px; }
  .faq { background: var(--white); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq details:last-child { border-bottom: 0; }
  .faq summary { list-style: none; cursor: pointer; padding: 14px 44px 14px 16px; position: relative;
                 font-family: var(--serif); font-weight: 600; font-size: 16.5px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
                        width: 24px; height: 24px; border-radius: 50%; background: var(--sand); color: #9C7A3C;
                        display: grid; place-items: center; font-family: inherit; font-size: 18px; line-height: 1; }
  .faq details[open] summary::after { content: "−"; }
  .faq details p { margin: 0; padding: 0 16px 14px; white-space: pre-line; font-size: 15px; color: var(--choc); }
  .swipe { text-align: center; color: var(--taupe); font-size: 12.5px; margin-top: 2px; }
  .sale { position: relative; overflow: hidden; display: flex; align-items: center; gap: 6px; margin: 22px 0 0;
          padding: 10px 26px 10px 6px; border-radius: 22px; z-index: 1;
          background: linear-gradient(135deg, #FBF4E6 0%, #F1E2C2 60%, #EAD5A8 100%); border: 1px solid #E6D2A6;
          box-shadow: 0 8px 22px rgba(196,163,94,.18); }
  .sale .gift { width: 84px; height: auto; flex: none; position: relative; z-index: 1; }
  .sale > svg.gift { width: 54px; height: 54px; margin: 0 10px; }
  .sale .txt { flex: 1; text-align: center; position: relative; z-index: 1; }
  .sale .t { font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.2; }
  .sale .s { font-family: var(--serif); font-size: 16px; line-height: 1.3; }
  .sale .star { position: absolute; right: 7px; top: 6px; width: 22px; height: 22px; }
  .sale .swoosh { position: absolute; right: 0; bottom: 0; width: 70%; height: 46px; }
  .hint { margin: 16px 4px 0; text-align: center; color: var(--taupe); font-size: 15px; white-space: pre-line; }
  h2 { display: flex; align-items: center; gap: 12px; font-family: var(--serif); font-weight: 600; font-size: 24px;
       margin: 30px 2px 14px; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--champ), transparent); }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
          margin-bottom: 16px; box-shadow: 0 6px 18px rgba(61,48,44,.05); }
  .card > img { width: 100%; height: auto; display: block; }
  .body { padding: 16px 18px 18px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--sand); display: grid; place-items: center; flex: none; }
  .ico svg { width: 20px; height: 20px; }
  .name { font-family: var(--serif); font-size: 20px; font-weight: 600; margin: 0; line-height: 1.25; }
  .text { white-space: pre-line; margin: 0 0 10px; font-size: 15.5px; }
  .meta { display: flex; align-items: flex-start; gap: 8px; color: var(--taupe); font-size: 14.5px; margin: 6px 0; }
  .meta svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .price { color: var(--choc); }
  .price b { font-family: var(--serif); font-size: 19px; }
  .price s { color: var(--taupe); margin-right: 6px; }
  .badge { display: inline-block; background: #F3E6CC; color: #7A5A22; border-radius: 8px; padding: 2px 9px;
           font-size: 13px; font-weight: 600; margin-top: 4px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 600;
         cursor: pointer; text-align: center; font-family: inherit; margin-top: 12px; }
  .main { background: linear-gradient(135deg, var(--champ), var(--champ2)); color: #fff;
          box-shadow: 0 6px 14px rgba(196,163,94,.30); }
  .ghost { background: transparent; color: #9C7A3C; border: 1.5px solid var(--champ); margin-top: 8px; }
  .full { display: none; white-space: pre-line; font-size: 15px; margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .full.on { display: block; }
  .full blockquote { margin: 8px 0; padding: 8px 12px; background: var(--milk); border-left: 3px solid var(--champ); border-radius: 8px; }
  .channel { background: linear-gradient(135deg, var(--champ), var(--champ2)); color: #fff; margin: 0 0 12px; }
  .list { background: var(--white); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .row { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer; gap: 12px; }
  .row:last-child { border-bottom: 0; }
  .row .ri { width: 34px; height: 34px; border-radius: 10px; background: var(--sand); display: grid; place-items: center; flex: none; }
  .row .ri svg { width: 19px; height: 19px; }
  .row .rl { color: var(--taupe); font-size: 14px; flex: none; }
  .row .rv { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto; text-align: right; }
  .docs { display: flex; gap: 8px; margin-top: 12px; }
  .docs .btn { font-size: 13px; padding: 11px 8px; font-weight: 500; margin-top: 0; }
  .footer { text-align: center; color: var(--taupe); font-size: 13px; margin-top: 24px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--choc); color: #fff;
           padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.on { opacity: .95; }
  .err { text-align: center; color: var(--taupe); padding: 60px 20px; }
</style>
</head>
<body>
<div class="wrap" id="root"><div class="err">Завантажую… 🌿</div></div>
<div class="toast" id="toast"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#F8F6F1"); tg.setBackgroundColor("#F8F6F1"); } catch (e) {} }
let DATA = null;

// Тонкі золотисті значки (лінії кольору шампань)
const G = 'fill="none" stroke="#C4A35E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  people: `<svg viewBox="0 0 24 24" ${G}><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c2.4.2 4.2 1.8 4.8 4.8"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" ${G}><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
  globe: `<svg viewBox="0 0 24 24" ${G}><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 3.6 5.2 3.6 8.5s-1.1 6.1-3.6 8.5c-2.5-2.4-3.6-5.2-3.6-8.5S9.5 5.9 12 3.5z"/></svg>`,
  heart: `<svg viewBox="0 0 24 24" ${G}><path d="M12 19.5s-7.5-4.4-7.5-9.6A4.1 4.1 0 0 1 12 7.6a4.1 4.1 0 0 1 7.5 2.3c0 5.2-7.5 9.6-7.5 9.6z"/></svg>`,
  book: `<svg viewBox="0 0 24 24" ${G}><path d="M4 5.5C6.5 4.5 9.5 4.6 12 6.5c2.5-1.9 5.5-2 8-1v13c-2.5-1-5.5-.9-8 1-2.5-1.9-5.5-2-8-1z"/><path d="M12 6.5v13"/></svg>`,
  sparkle: `<svg viewBox="0 0 24 24" ${G}><path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2L5 10.5l5.2-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>`,
  chat: `<svg viewBox="0 0 24 24" ${G}><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5v-3.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5z"/></svg>`,
  spiral: `<svg viewBox="0 0 24 24" ${G}><path d="M12 12.2a1.3 1.3 0 1 1 1.3-1.3 2.9 2.9 0 0 1-2.9 2.9 4.4 4.4 0 0 1-4.4-4.4A6 6 0 0 1 12 3.4a7.6 7.6 0 0 1 7.6 7.6A9.1 9.1 0 0 1 10.5 20"/></svg>`,
  tree: `<svg viewBox="0 0 24 24" ${G}><path d="M12 21v-7"/><path d="M12 14c-4 0-6.5-2.4-6.5-5.3S8.4 3.5 12 3.5s6.5 2.3 6.5 5.2S16 14 12 14z"/><path d="M12 14l-3-2.5M12 12.5l3-2.5"/></svg>`,
  crown: `<svg viewBox="0 0 24 24" ${G}><path d="M4 8l4 4 4-6 4 6 4-4-1.5 10h-13z"/><path d="M5.5 20.5h13"/></svg>`,
  laptop: `<svg viewBox="0 0 24 24" ${G}><rect x="5" y="5.5" width="14" height="9.5" rx="1.2"/><path d="M3 18.5h18"/></svg>`,
  coin: `<svg viewBox="0 0 24 24" ${G}><path d="M12 19.5s-7.5-4.4-7.5-9.6A4.1 4.1 0 0 1 12 7.6a4.1 4.1 0 0 1 7.5 2.3c0 5.2-7.5 9.6-7.5 9.6z"/></svg>`,
  award: `<svg viewBox="0 0 24 24" ${G}><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 21l5-2.5 5 2.5-1.5-7.5"/></svg>`,
  search: `<svg viewBox="0 0 24 24" ${G}><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>`,
  shield: `<svg viewBox="0 0 24 24" ${G}><path d="M12 3.5l7 2.8v5.2c0 4.3-3 7.6-7 9-4-1.4-7-4.7-7-9V6.3z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>`,
  hands: `<svg viewBox="0 0 24 24" ${G}><path d="M12 19.5s-7.5-4.4-7.5-9.6A4.1 4.1 0 0 1 12 7.6a4.1 4.1 0 0 1 7.5 2.3c0 5.2-7.5 9.6-7.5 9.6z"/><path d="M9 11.5h6M12 8.8v5.4"/></svg>`,
  instagram: `<svg viewBox="0 0 24 24" ${G}><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6" fill="#C4A35E"/></svg>`,
  tiktok: `<svg viewBox="0 0 24 24" ${G}><path d="M13.5 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M13.5 4c.4 2.6 2.2 4.3 5 4.5"/></svg>`,
  youtube: `<svg viewBox="0 0 24 24" ${G}><rect x="3" y="6" width="18" height="12" rx="3.5"/><path d="M10.5 9.5v5l4.2-2.5z" fill="#C4A35E"/></svg>`,
  telegram: `<svg viewBox="0 0 24 24" ${G}><path d="M20.5 4.5L3.5 11l6 2.2 2.3 6.3 3.2-4 4.6 3.5z"/><path d="M9.5 13.2l11-8.7"/></svg>`,
  phone: `<svg viewBox="0 0 24 24" ${G}><path d="M6.5 3.5h3l1.5 4-2 1.3a10 10 0 0 0 6.2 6.2l1.3-2 4 1.5v3a2 2 0 0 1-2 2A15.5 15.5 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"/></svg>`,
  star: `<svg viewBox="0 0 24 24" fill="#D6B875"><path d="M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5z"/></svg>`,
  swoosh: `<svg viewBox="0 0 200 46" preserveAspectRatio="none" fill="none"><path d="M0 44C60 40 130 28 200 6" stroke="#D6B875" stroke-width="1.6"/><path d="M40 46C100 40 150 30 200 18" stroke="#E6CF9C" stroke-width="1"/></svg>`,
  gift: `<svg viewBox="0 0 48 48" fill="none" stroke="#B8954F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="20" width="32" height="20" rx="2" fill="#FBF5EA"/><rect x="6" y="14" width="36" height="7" rx="1.5" fill="#F3E6CC"/><path d="M24 14v26"/><path d="M24 14c-3-6-11-7-11-2.5S20 14 24 14zM24 14c3-6 11-7 11-2.5S28 14 24 14z" fill="#F3E6CC"/></svg>`,
  lotus: `<svg viewBox="0 0 32 20" width="30" height="18" fill="none" stroke="#C4A35E" stroke-width="1.3" stroke-linejoin="round"><path d="M16 3c3 3 3 9 0 13-3-4-3-10 0-13z"/><path d="M16 16c-1-4-4-8-9-8 0 5 4 8 9 8zM16 16c1-4 4-8 9-8 0 5-4 8-9 8z"/><path d="M4 16c4 0 8 0 12 0s8 0 12 0"/></svg>`,
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function svg(name, cls) { const s = el("span", cls || ""); s.innerHTML = ICONS[name] || ""; return s.firstChild || s; }
function toast(t) {
  const x = document.getElementById("toast"); x.textContent = t; x.classList.add("on");
  setTimeout(() => x.classList.remove("on"), 1800);
}
function openUrl(url) {
  if (!tg) { window.open(url, "_blank"); return; }
  if (/^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url); else tg.openLink(url);
}
// Кнопка → повідомлення агенту (він відповідає в чаті). Відкрито з меню: sendData. Інакше: посилання на агента.
function act(action) {
  const keyboardLaunch = tg && tg.initData && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id);
  if (keyboardLaunch) {
    try { tg.sendData(JSON.stringify({ a: action })); return; } catch (e) {}
  }
  if (DATA && DATA.bot) {
    const key = action.split(":")[1] || "";
    const start = action.startsWith("prod:") || action.startsWith("write:") ? key : "";
    openUrl("https://t.me/" + DATA.bot + (start ? "?start=" + encodeURIComponent(start) : ""));
    if (tg) setTimeout(() => tg.close(), 300);
  }
}
function meta(icon, node) { const m = el("div", "meta"); m.append(svg(icon), node); return m; }
function priceLine(c, sale) {
  const p = el("div", "price");
  if (sale && c.sale && /грн/.test(c.sale) && /грн/.test(c.price)) {
    p.append(el("s", "", c.price), el("b", "", c.sale));
  } else if (/грн|€/.test(c.price)) {
    p.append(el("b", "", c.price));
  } else {
    p.append(el("span", "", c.price));
  }
  if (sale && c.sale && !/грн/.test(c.sale)) { p.append(document.createElement("br"), el("span", "badge", c.sale)); }
  return meta("coin", p);
}
function render(d) {
  const a = d.app, root = document.getElementById("root");
  root.innerHTML = "";
  const dec = a.decor || {};
  [["flower_l", "l"], ["flower_r", "r"]].forEach(([k, side]) => {
    if (dec[k]) { const i = el("img", "decor " + side); i.src = dec[k]; i.alt = ""; root.append(i); }
  });
  const hero = el("div", "hero");
  if (a.photo) { const img = el("img", "avatar"); img.src = a.photo; img.alt = a.title; hero.append(img); }
  const orn = el("div", "orn"); orn.append(el("i"), svg("lotus"), el("i"));
  hero.append(el("h1", "", a.title), orn, el("p", "role", a.role), el("p", "intro", a.intro));
  const facts = el("div", "facts");
  (a.facts || []).forEach(([icon, num, label, pre]) => {
    const c = el("span", "chip"), t = el("span", !pre && (/\s/.test(label) || label.length > 6) ? "two" : "");
    if (pre) t.append(el("span", "pre", pre));
    t.append(el("b", "", num), document.createTextNode(label));
    c.append(svg(icon), t); facts.append(c);
  });
  hero.append(facts); root.append(hero);
  if (d.sale && a.sale_title) {
    const s = el("div", "sale"), txt = el("div", "txt");
    txt.append(el("div", "t", a.sale_title), el("div", "s", a.sale_text));
    let gift;
    if (dec.gift) { gift = el("img", "gift"); gift.src = dec.gift; gift.alt = ""; } else { gift = svg("gift"); gift.classList.add("gift"); }
    const star = svg("star"); star.classList.add("star");
    const sw = svg("swoosh"); sw.classList.add("swoosh");
    s.append(sw, gift, txt, star); root.append(s);
  }
  if (a.method && a.method.length) {
    root.append(el("h2", "", a.method_title));
    if (a.method_sub) root.append(el("p", "sub", a.method_sub));
    const st = el("div", "steps");
    a.method.forEach(([t, txt], i) => {
      const s = el("div", "step"), body = el("div"); body.append(el("b", "", t), el("p", "", txt));
      s.append(el("span", "num", String(i + 1)), body); st.append(s);
    });
    root.append(st);
  }
  if (a.trust && a.trust.length) {
    root.append(el("h2", "", a.trust_title));
    a.trust.forEach(([icon, t, txt]) => {
      const r = el("div", "tr"), ico = el("span", "ico"), body = el("div");
      ico.append(svg(icon)); body.append(el("b", "", t), el("p", "", txt)); r.append(ico, body); root.append(r);
    });
    if (a.trust_quote) root.append(el("p", "quote", a.trust_quote));
  }
  if (a.reviews && a.reviews.length) {
    root.append(el("h2", "", a.reviews_title));
    const box = el("div", "reviews");
    a.reviews.forEach(([txt, who]) => {
      const c = el("div", "rv-card"); c.append(el("span", "qm", "“"), el("p", "", txt), el("span", "", who)); box.append(c);
    });
    root.append(box); if (a.swipe_hint) root.append(el("p", "swipe", a.swipe_hint));
  }
  if (a.faq && a.faq.length) {
    root.append(el("h2", "", a.faq_title));
    const box = el("div", "faq");
    a.faq.forEach(([q, ans]) => {
      const d = el("details"); d.append(el("summary", "", q), el("p", "", ans)); box.append(d);
    });
    root.append(box);
  }
  if (a.start_hint) root.append(el("p", "hint", a.start_hint));

  root.append(el("h2", "", a.services_title));
  d.cards.forEach(c => {
    const card = el("div", "card");
    if (c.photo) { const img = el("img"); img.src = c.photo; img.alt = c.name; img.loading = "lazy"; card.append(img); }
    const b = el("div", "body"), head = el("div", "head"), ico = el("span", "ico");
    ico.append(svg(c.icon)); head.append(ico, el("p", "name", c.name));
    b.append(head, el("p", "text", c.text));
    if (c.format) b.append(meta("laptop", el("span", "", c.format)));
    b.append(priceLine(c, d.sale));
    if (c.full) {
      const full = el("div", "full"); full.innerHTML = c.full;   // повний опис з texts.py (тексти власниці)
      const t = el("button", "btn ghost", a.read_more);
      t.onclick = () => { const on = full.classList.toggle("on"); t.textContent = on ? a.read_less : a.read_more; };
      b.append(full, t);
    }
    const main = el("button", "btn main", c.btn[0]); main.onclick = () => act(c.btn[1]); b.append(main);
    if (c.more) { const m = el("button", "btn ghost", a.more_btn); m.onclick = () => act(c.more); b.append(m); }
    card.append(b); root.append(card);
  });

  root.append(el("h2", "", a.contacts_title));
  if (d.channel) { const ch = el("button", "btn channel", a.channel_btn); ch.onclick = () => openUrl(d.channel); root.append(ch); }
  const list = el("div", "list");
  const row = (icon, label, value) => {
    const r = el("div", "row"), ri = el("span", "ri"); ri.append(svg(icon));
    r.append(ri, el("span", "rl", label), el("span", "rv", value)); return r;
  };
  d.links.forEach(([icon, label, shown, url]) => {
    const r = row(icon, label, shown); r.onclick = () => openUrl(url); list.append(r);
  });
  if (a.phone) {
    const r = row("phone", a.phone_note, a.phone);
    r.onclick = () => {
      const num = a.phone.replace(/[^+\d]/g, "");
      if (navigator.clipboard) navigator.clipboard.writeText(num).then(() => toast(a.copied), () => toast(num));
      else toast(num);
    };
    list.append(r);
  }
  root.append(list);
  if (a.docs && a.docs.length) {
    const docs = el("div", "docs");
    a.docs.forEach(([t, action]) => { const x = el("button", "btn ghost", t); x.onclick = () => act(action); docs.append(x); });
    root.append(docs);
  }
  if (a.footer) root.append(el("p", "footer", a.footer));
}
fetch("data.json", { cache: "no-store" }).then(r => r.json()).then(d => { DATA = d; render(d); })
  .catch(() => { document.getElementById("root").innerHTML = '<div class="err">Не вдалося завантажити 🙏<br>Спробуйте ще раз за хвилинку.</div>'; });
if (tg && tg.initData) fetch("open", { method: "POST", body: tg.initData }).catch(() => {});
</script>
</body>
</html>
